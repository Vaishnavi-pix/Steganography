<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steganography Demo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Quicksand", sans-serif;
    }

    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 9999;
      display: none;
    }

    #loadingScreen.show {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .loading-text {
      margin-top: 20px;
      font-size: 1.5rem;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- Loading Screen -->
  <div id="loadingScreen">
    <div class="spinner-border text-light" style="width: 5rem; height: 5rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <div class="loading-text" id="loadingMessage">
      Processing...
    </div>
  </div>

  <div class="container">
    <div class="row">
      <center>
        <h1 class="display-1"><strong><u>Steganography Demo</u></strong></h1>
      </center>
    </div>

    <br><br>

    <form>
      <div class="row">

        <div class="col">
          <div class="form-group">
            <center>
              <label for="inputText" class="display-6">Input</label>
            </center>

            <textarea class="form-control" id="inputText" rows="10"
              style="border-width:10px; border-color:white; font-size:24px;"></textarea>

            <br>

            <button type="submit" class="btn btn-success"
              onclick="doConversion(event)"
              style="width:450px; margin-left:100px; font-size:x-large;">
              Convert
            </button>
          </div>
        </div>

        <div class="col">
          <div class="form-group">
            <center>
              <label for="outputText" class="display-6">Output Text</label>
            </center>

            <textarea class="form-control" id="outputText" rows="10"
              style="border-width:10px; border-color:white; font-size:24px;"></textarea>

            <br>

            <button type="submit" class="btn btn-danger"
              onclick="deConvert(event)"
              style="width:450px; margin-left:100px; font-size:x-large;">
              DeConvert
            </button>
          </div>
        </div>

      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>

  <script>

    function showLoading(message = "Processing...") {
      document.getElementById("loadingMessage").innerText = message;
      document.getElementById("loadingScreen").classList.add("show");
    }

    function hideLoading() {
      document.getElementById("loadingScreen").classList.remove("show");
    }

    async function doConversion(event) {
      event.preventDefault();

      showLoading("Encoding hidden text...");

      try {
        const response = await fetch("stegText", {
          method: "POST",
          body: JSON.stringify({
            inputText: document.getElementById("inputText").value
          }),
          headers: {
            "Content-Type": "application/json"
          }
        });

        const result = await response.text();
        document.getElementById("outputText").value = result;

      } catch (err) {
        console.error(err);
        alert("Error during conversion.");
      } finally {
        hideLoading();
      }
    }

    async function deConvert(event) {
      event.preventDefault();

      showLoading("Decoding hidden text...");

      try {
        const response = await fetch("deStegText", {
          method: "POST",
          body: JSON.stringify({
            inputText: document.getElementById("inputText").value
          }),
          headers: {
            "Content-Type": "application/json"
          }
        });

        const result = await response.text();
        document.getElementById("outputText").value = result;

      } catch (err) {
        console.error(err);
        alert("Error during deconversion.");
      } finally {
        hideLoading();
      }
    }

  </script>

</body>
</html>
